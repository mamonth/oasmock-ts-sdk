openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
paths:
  /ping:
    get:
      responses:
        200:
          description: OK
          content:
            application/json:
              example:
                message: pong
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User found
          content:
            application/json:
              example:
                id: "123"
                name: "Test User"